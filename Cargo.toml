[package]
name = "transfigure"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Turn long commands into portable, argument-aware shortcuts"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
