[package]
name = "transfigure"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Turn long commands and repeatable workflows into short commands"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
