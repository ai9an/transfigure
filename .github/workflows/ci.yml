name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  installer-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sh -n install.sh
      - shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null'
      - name: Check one-command PowerShell isolation
        shell: pwsh
        run: |
          $Version = "caller-version"
          $InstallDir = $null
          $env:TRANSFIGURE_VERSION = "invalid-test-version"
          $env:TRANSFIGURE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "transfigure-installer-test"
          $env:PROCESSOR_ARCHITECTURE = "AMD64"
          try {
            $failure = $null
            try { Get-Content -Raw install.ps1 | Invoke-Expression } catch { $failure = $_ }
            if ($null -eq $failure) { throw "Installer should reject the test version" }
            if ($failure.Exception.Message -notlike "Could not determine a valid release version*") {
              throw $failure
            }
            if ($Version -ne "caller-version" -or $null -ne $InstallDir) {
              throw "Installer leaked variables into the caller scope"
            }
          } finally {
            Remove-Item Env:TRANSFIGURE_VERSION -ErrorAction SilentlyContinue
            Remove-Item Env:TRANSFIGURE_INSTALL_DIR -ErrorAction SilentlyContinue
            Remove-Item Env:PROCESSOR_ARCHITECTURE -ErrorAction SilentlyContinue
          }
      - name: Check installer defaults
        shell: pwsh
        run: |
          $ps = Get-Content -Raw install.ps1
          $sh = Get-Content -Raw install.sh
          if (-not $ps.Contains('"ai9an/transfigure"')) { throw "Missing PowerShell repository default" }
          if (-not $sh.Contains('ai9an/transfigure')) { throw "Missing POSIX repository default" }
