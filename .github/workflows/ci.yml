name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  installer-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sh -n install.sh
      - shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null'
      - name: Check rendered installer guards
        shell: pwsh
        run: |
          $repo = "example/transfigure"
          $ps = (Get-Content -Raw install.ps1).Replace("__TRANSFIGURE_REPOSITORY__", $repo)
          $sh = (Get-Content -Raw install.sh).Replace("__TRANSFIGURE_REPOSITORY__", $repo)
          if ($ps.Contains("__TRANSFIGURE_REPOSITORY__") -or $sh.Contains("__TRANSFIGURE_REPOSITORY__")) { throw "Unrendered repository token" }
          if ($ps.Contains('if ($Repository -eq "example/transfigure")')) { throw "PowerShell guard was rendered true" }
          if ($sh.Contains('if [ "$REPOSITORY" = "example/transfigure" ]')) { throw "POSIX guard was rendered true" }
          [scriptblock]::Create($ps) | Out-Null
