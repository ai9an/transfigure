name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  installer-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sh -n install.sh
      - shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null'
      - name: Check installer defaults
        shell: pwsh
        run: |
          $ps = Get-Content -Raw install.ps1
          $sh = Get-Content -Raw install.sh
          if (-not $ps.Contains('"ai9an/transfigure"')) { throw "Missing PowerShell repository default" }
          if (-not $sh.Contains('ai9an/transfigure')) { throw "Missing POSIX repository default" }
